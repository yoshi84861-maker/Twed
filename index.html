<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫蘭迪綠匯率計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f4f6f4;
            color: #5a6b5d;
        }

        /* 莫蘭迪綠配色方案 */
        .morandi-header {
            background-color: #8da090;
        }

        .morandi-bg {
            background-color: #a7b8a8;
        }

        .morandi-card {
            background-color: #ffffff;
            border: 1px solid #d1dbd2;
        }

        .morandi-input-bg {
            background-color: #f8faf8;
            border: 1px solid #c8d4c9;
        }

        .morandi-text {
            color: #5a6b5d;
        }

        .morandi-accent {
            color: #768a79;
        }

        .drop-shadow-morandi {
            filter: drop-shadow(0 4px 10px rgba(141, 160, 144, 0.2));
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a6b5d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
        }
    </style>
</head>

<body class="antialiased">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col">

    <header class="p-10 morandi-header text-white rounded-b-[3rem] text-center shadow-md">
        <h1 class="text-2xl font-medium tracking-widest mb-1">
            匯率計算機
        </h1>

        <p id="status" class="text-xs opacity-80 font-light">
            數據讀取中...
        </p>
    </header>

    <main class="p-8 -mt-8 space-y-6">

        <!-- 輸入區 -->
        <div class="morandi-card p-6 rounded-[2rem] drop-shadow-morandi">

            <div class="flex justify-between items-center mb-3">

                <select
                    id="baseCurrency"
                    onchange="calculateAll()"
                    class="bg-transparent font-bold morandi-text outline-none pr-6 cursor-pointer text-sm tracking-widest">

                    <option value="TWD">台幣 TWD</option>
                    <option value="JPY">日幣 JPY</option>
                    <option value="CNY">人民幣 CNY</option>
                    <option value="GBP">英鎊 GBP</option>
                    <option value="USD">美金 USD</option>

                </select>

                <div id="flag-icon">🇹🇼</div>

            </div>

            <div class="flex items-center">

                <input
                    type="number"
                    id="mainInput"
                    value="1000"
                    oninput="calculateAll()"
                    class="w-full text-4xl font-light outline-none bg-transparent morandi-text">

            </div>
        </div>


        <!-- 換算結果 -->
        <div class="space-y-4">

            <!-- 結果 1 -->
            <div id="card-1"
                 class="morandi-input-bg p-5 rounded-3xl flex justify-between items-center relative">

                <div id="tag-1"
                     class="hidden absolute -top-2 left-6 bg-[#d9a39a] text-white text-[9px] px-2 py-0.5 rounded-full">
                    近期低點
                </div>

                <div>
                    <p id="label-1"
                       class="text-xs morandi-accent font-medium mb-1 uppercase tracking-tight">
                        日幣 JPY
                    </p>

                    <p id="rate-1"
                       class="text-[10px] opacity-60 font-mono">
                        匯率: --
                    </p>
                </div>

                <div id="res-1"
                     class="text-2xl font-medium morandi-text">
                    0.00
                </div>

            </div>


            <!-- 結果 2 -->
            <div id="card-2"
                 class="morandi-input-bg p-5 rounded-3xl flex justify-between items-center relative">

                <div id="tag-2"
                     class="hidden absolute -top-2 left-6 bg-[#d9a39a] text-white text-[9px] px-2 py-0.5 rounded-full">
                    近期低點
                </div>

                <div>
                    <p id="label-2"
                       class="text-xs morandi-accent font-medium mb-1 uppercase tracking-tight">
                        人民幣 CNY
                    </p>

                    <p id="rate-2"
                       class="text-[10px] opacity-60 font-mono">
                        匯率: --
                    </p>
                </div>

                <div id="res-2"
                     class="text-2xl font-medium morandi-text">
                    0.00
                </div>

            </div>


            <!-- 結果 3 -->
            <div id="card-3"
                 class="morandi-input-bg p-5 rounded-3xl flex justify-between items-center relative">

                <div id="tag-3"
                     class="hidden absolute -top-2 left-6 bg-[#d9a39a] text-white text-[9px] px-2 py-0.5 rounded-full">
                    近期低點
                </div>

                <div>
                    <p id="label-3"
                       class="text-xs morandi-accent font-medium mb-1 uppercase tracking-tight">
                        英鎊 GBP
                    </p>

                    <p id="rate-3"
                       class="text-[10px] opacity-60 font-mono">
                        匯率: --
                    </p>
                </div>

                <div id="res-3"
                     class="text-2xl font-medium morandi-text">
                    0.00
                </div>

            </div>


            <!-- 結果 4 -->
            <div id="card-4"
                 class="morandi-input-bg p-5 rounded-3xl flex justify-between items-center relative">

                <div id="tag-4"
                     class="hidden absolute -top-2 left-6 bg-[#d9a39a] text-white text-[9px] px-2 py-0.5 rounded-full">
                    近期低點
                </div>

                <div>
                    <p id="label-4"
                       class="text-xs morandi-accent font-medium mb-1 uppercase tracking-tight">
                        美金 USD
                    </p>

                    <p id="rate-4"
                       class="text-[10px] opacity-60 font-mono">
                        匯率: --
                    </p>
                </div>

                <div id="res-4"
                     class="text-2xl font-medium morandi-text">
                    0.00
                </div>

            </div>

        </div>

    </main>


    <footer class="mt-auto p-10">

        <button
            onclick="fetchLatest()"
            class="w-full py-4 morandi-bg text-white rounded-2xl font-medium shadow-sm active:scale-95 transition-all text-xs tracking-[0.2em]">

            REFRESH DATA

        </button>

    </footer>

</div>


<script>

    /*
     * 所有匯率都以 TWD 為基準
     *
     * 例如：
     * rates.JPY = 1 TWD 可以換多少 JPY
     * rates.CNY = 1 TWD 可以換多少 CNY
     * rates.GBP = 1 TWD 可以換多少 GBP
     * rates.USD = 1 TWD 可以換多少 USD
     */

    let rates = {
        JPY: 4.72,
        CNY: 0.223,
        GBP: 0.023,
        USD: 0.031
    };


    /*
     * 國旗
     */
    const flags = {
        TWD: '🇹🇼',
        JPY: '🇯🇵',
        CNY: '🇨🇳',
        GBP: '🇬🇧',
        USD: '🇺🇸'
    };


    /*
     * 原本的近期低點判定保留
     */
    const lowBenchmarks = {
        JPY: 4.68,
        CNY: 0.221
    };


    /*
     * 取得最新匯率
     */
    async function fetchLatest() {

        document.getElementById('status').innerText = "數據同步中...";

        try {

            const res = await fetch(
                'https://open.er-api.com/v6/latest/TWD'
            );

            const data = await res.json();

            rates.JPY = data.rates.JPY;
            rates.CNY = data.rates.CNY;
            rates.GBP = data.rates.GBP;
            rates.USD = data.rates.USD;

            document.getElementById('status').innerText =
                "數據更新於: " +
                new Date().toLocaleTimeString();

            calculateAll();

        } catch (e) {

            document.getElementById('status').innerText =
                "使用離線數據模式";

            calculateAll();
        }
    }


    /*
     * 設定結果卡片
     */
    function setResult(cardNumber, currency, value, rateText) {

        document.getElementById(`label-${cardNumber}`).innerText =
            currency;

        document.getElementById(`res-${cardNumber}`).innerText =
            value.toLocaleString(undefined, {
                maximumFractionDigits: 2
            });

        document.getElementById(`rate-${cardNumber}`).innerText =
            rateText;
    }


    /*
     * 清除近期低點標籤
     */
    function hideTags() {

        for (let i = 1; i <= 4; i++) {

            document
                .getElementById(`tag-${i}`)
                .classList
                .add('hidden');

        }
    }


    /*
     * 主要換算功能
     */
    function calculateAll() {

        const base =
            document.getElementById('baseCurrency').value;

        const input =
            parseFloat(
                document.getElementById('mainInput').value
            ) || 0;


        /*
         * 更新國旗
         */
        document.getElementById('flag-icon').innerText =
            flags[base];


        hideTags();


        /*
         * TWD
         */
        if (base === 'TWD') {

            setResult(
                1,
                "日幣 JPY",
                input * rates.JPY,
                `1 TWD = ${rates.JPY.toFixed(4)} JPY`
            );

            setResult(
                2,
                "人民幣 CNY",
                input * rates.CNY,
                `1 TWD = ${rates.CNY.toFixed(4)} CNY`
            );

            setResult(
                3,
                "英鎊 GBP",
                input * rates.GBP,
                `1 TWD = ${rates.GBP.toFixed(4)} GBP`
            );

            setResult(
                4,
                "美金 USD",
                input * rates.USD,
                `1 TWD = ${rates.USD.toFixed(4)} USD`
            );


            /*
             * 原本的低點判定
             */
            if (rates.JPY >= lowBenchmarks.JPY) {

                document
                    .getElementById('tag-1')
                    .classList
                    .remove('hidden');

            }

            if (rates.CNY >= lowBenchmarks.CNY) {

                document
                    .getElementById('tag-2')
                    .classList
                    .remove('hidden');

            }

        }


        /*
         * JPY
         */
        else if (base === 'JPY') {

            setResult(
                1,
                "台幣 TWD",
                input / rates.JPY,
                `1 JPY = ${(1 / rates.JPY).toFixed(4)} TWD`
            );

            setResult(
                2,
                "人民幣 CNY",
                (input / rates.JPY) * rates.CNY,
                `1 JPY = ${(rates.CNY / rates.JPY).toFixed(4)} CNY`
            );

            setResult(
                3,
                "英鎊 GBP",
                (input / rates.JPY) * rates.GBP,
                `1 JPY = ${(rates.GBP / rates.JPY).toFixed(4)} GBP`
            );

            setResult(
                4,
                "美金 USD",
                (input / rates.JPY) * rates.USD,
                `1 JPY = ${(rates.USD / rates.JPY).toFixed(4)} USD`
            );

        }


        /*
         * CNY
         */
        else if (base === 'CNY') {

            setResult(
                1,
                "台幣 TWD",
                input / rates.CNY,
                `1 CNY = ${(1 / rates.CNY).toFixed(4)} TWD`
            );

            setResult(
                2,
                "日幣 JPY",
                (input / rates.CNY) * rates.JPY,
                `1 CNY = ${(rates.JPY / rates.CNY).toFixed(4)} JPY`
            );

            setResult(
                3,
                "英鎊 GBP",
                (input / rates.CNY) * rates.GBP,
                `1 CNY = ${(rates.GBP / rates.CNY).toFixed(4)} GBP`
            );

            setResult(
                4,
                "美金 USD",
                (input / rates.CNY) * rates.USD,
                `1 CNY = ${(rates.USD / rates.CNY).toFixed(4)} USD`
            );

        }


        /*
         * GBP
         */
        else if (base === 'GBP') {

            setResult(
                1,
                "台幣 TWD",
                input / rates.GBP,
                `1 GBP = ${(1 / rates.GBP).toFixed(4)} TWD`
            );

            setResult(
                2,
                "日幣 JPY",
                (input / rates.GBP) * rates.JPY,
                `1 GBP = ${(rates.JPY / rates.GBP).toFixed(4)} JPY`
            );

            setResult(
                3,
                "人民幣 CNY",
                (input / rates.GBP) * rates.CNY,
                `1 GBP = ${(rates.CNY / rates.GBP).toFixed(4)} CNY`
            );

            setResult(
                4,
                "美金 USD",
                (input / rates.GBP) * rates.USD,
                `1 GBP = ${(rates.USD / rates.GBP).toFixed(4)} USD`
            );

        }


        /*
         * USD
         */
        else if (base === 'USD') {

            setResult(
                1,
                "台幣 TWD",
                input / rates.USD,
                `1 USD = ${(1 / rates.USD).toFixed(4)} TWD`
            );

            setResult(
                2,
                "日幣 JPY",
                (input / rates.USD) * rates.JPY,
                `1 USD = ${(rates.JPY / rates.USD).toFixed(4)} JPY`
            );

            setResult(
                3,
                "人民幣 CNY",
                (input / rates.USD) * rates.CNY,
                `1 USD = ${(rates.CNY / rates.USD).toFixed(4)} CNY`
            );

            setResult(
                4,
                "英鎊 GBP",
                (input / rates.USD) * rates.GBP,
                `1 USD = ${(rates.GBP / rates.USD).toFixed(4)} GBP`
            );

        }

    }


    /*
     * 網頁開啟時自動取得最新匯率
     */
    fetchLatest();

</script>

</body>
</html>
```
